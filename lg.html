<html lang="ko">
<head>

<style>
:root{
  --bg:#f3f5f9;--card:#fff;--ink:#111827;--sub:#5f6b7c;--line:#e2e7ef;--soft:#f1f4f9;
  --pri:#a50034;--pri-d:#7a0026;--pri-soft:#fbe9ef;--acc:#c2410c;--acc-soft:#fff2e8;--ok:#047857;--ok-soft:#e3f6ee;
  --navy:#0f1d45;--r:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:90px}
@media(min-width:960px){body{padding-bottom:0}}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}
.top{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:30}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:18px;letter-spacing:-.3px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;background:rgba(255,255,255,.12);border-radius:99px;padding:3px;flex:none}
.brand a{color:#fff;text-decoration:none;font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px;opacity:.7}
.brand a.on{background:#fff;color:var(--pri);opacity:1}
.top .me{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:4px 11px;font-size:12px;flex:none}
.top .rst{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:4px 12px;font-size:12px;flex:none}
@media(max-width:520px){.top h1{font-size:16px}.top .me{display:none}}
.dbar{max-width:1180px;margin:0 auto;padding:10px 16px 0;font-size:12.5px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap}
.dbar span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 16px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
@media(max-width:959px){.wrap{grid-template-columns:minmax(0,1fr);padding:10px 12px}}
main,aside{min-width:0}
aside{position:sticky;top:70px}
@media(max-width:959px){aside{position:static}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
@media(max-width:520px){.card{padding:15px}}
.card h2{margin:0 0 14px;font-size:17px;display:flex;align-items:center;gap:8px;letter-spacing:-.3px}
.card h2 .cnt{margin-left:auto;font-size:13px;color:var(--sub);font-weight:600}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px;font-weight:800;flex:none}
.lbl{font-size:13px;color:var(--sub);margin:16px 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;font-size:14px;line-height:1.2;white-space:nowrap;min-height:40px}
.chip:hover{border-color:#c9b3bd}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.chip small{opacity:.8;font-size:12px;margin-left:4px}
.chip.sm{padding:6px 11px;min-height:34px;font-size:13px}
input[type=text],input[type=password],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff;min-height:48px;font-size:16px}
input:focus,select:focus{outline:3px solid var(--pri-soft);border-color:var(--pri)}
.search{position:relative}
.search input{padding-left:42px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
.list{margin-top:10px;border:1px solid var(--line);border-radius:12px;max-height:360px;overflow:auto}
.list .it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it:hover{background:var(--pri-soft)}
.list .it b{font-size:15px;display:block;word-break:break-all}
.list .it span{font-size:12.5px;color:var(--sub)}
.list .it .pr{font-size:13px;font-weight:700;white-space:nowrap;text-align:right}
.list .msg{padding:16px;color:var(--sub);font-size:14px;text-align:center}
.bd{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.bd.act{background:#fff1e6;color:#c2410c}.bd.wk{background:#fde8ef;color:var(--pri)}.bd.gift{background:var(--ok-soft);color:var(--ok)}
.picked{border:2px solid var(--pri);border-radius:14px;padding:14px;background:#fffafb;margin-top:14px}
.picked-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.picked-h b{font-size:18px;word-break:break-all}
.picked-h .meta{font-size:13px;color:var(--sub)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;min-height:46px}
.btn.pri{background:var(--pri);color:#fff}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13px;font-weight:700}
.btn.wide{width:100%}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.brk{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.brk .r{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;gap:10px}
.brk .r span:first-child{color:var(--sub)}
.brk .r.minus span:last-child{color:var(--ok);font-weight:700}
.brk .r.wk span:last-child{color:var(--pri);font-weight:800}
.brk .tot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}

.note{font-size:12.5px;color:var(--sub);background:var(--soft);border-radius:10px;padding:9px 12px;margin-top:10px;line-height:1.55}

.pre-in{display:flex;gap:8px;align-items:center;margin-top:8px}
.pre-in input{min-height:40px;font-size:15px}
.cart .ci{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;position:relative}
.cart .ci b{font-size:14.5px;display:block;padding-right:28px;word-break:break-all}
.cart .ci .o{font-size:12.5px;color:var(--sub)}
.cart .ci .m{font-weight:800;font-size:16px;margin-top:4px}
.cart .ci .m small{font-weight:500;color:var(--sub);font-size:12px}
.cart .ci .x{position:absolute;right:8px;top:8px;border:0;background:var(--soft);border-radius:50%;width:26px;height:26px;color:var(--sub)}
.cart .empty{color:var(--sub);font-size:14px;text-align:center;padding:22px 8px}
.sum{border-top:2px solid var(--ink);margin-top:6px;padding-top:12px}
.sum .r{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.sum .big{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 12px}
.sum .big b{font-size:28px;color:var(--pri);letter-spacing:-.6px}
.mbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;z-index:25;box-shadow:0 -6px 18px rgba(15,29,69,.06)}
.mbar .t{flex:1;font-size:13px;color:var(--sub)}.mbar .t b{display:block;font-size:19px;color:var(--ink)}
@media(min-width:960px){.mbar{display:none}}
.actbox .grp{font-size:13px;font-weight:800;margin:12px 0 6px;color:var(--sub)}
.actbox .a{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:6px;cursor:pointer;font-size:13.5px}
.actbox .a:hover{border-color:var(--pri)}
.actbox .a b{word-break:break-all}
.actbox .a .v{white-space:nowrap;font-weight:800;color:var(--acc);text-align:right}
.actbox .a .v small{display:block;font-weight:500;color:var(--sub);font-size:11.5px}
.foot{text-align:center;font-size:12px;color:var(--sub);padding:20px 0 30px}
.foot a{color:var(--sub)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(min-width:960px){.toast{bottom:28px}}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:18px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;font-size:18px}
.modal h3 button{border:0;background:var(--soft);border-radius:50%;width:32px;height:32px}
.file-drop{display:block;border:2px dashed #d4c2ca;border-radius:12px;padding:18px;text-align:center;cursor:pointer;margin-top:12px;font-weight:700}
.file-drop small{font-weight:500;color:var(--sub)}
.hint{font-size:13px;color:var(--sub);margin-top:8px}
.warn{background:#fef2f2;color:#b91c1c;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.gate{position:fixed;inset:0;background:var(--navy);color:#fff;display:none;align-items:center;justify-content:center;z-index:80;text-align:center;padding:20px}
.gate.on{display:flex}
.gate .b{background:#fff;color:var(--ink);border-radius:20px;padding:26px 22px;max-width:360px;width:100%}
</style>
</head>

<div class="gate" id="gate"><div class="b">
  <h2 style="margin:0 0 8px">사번 확인이 필요해요</h2>
  <p style="color:var(--sub);font-size:14px;margin:0 0 16px">삼성 계산기에서 사번을 입력하면<br>LG 계산기로 바로 돌아와요.</p>
  <a class="btn pri wide" href="./?to=lg">사번 입력하러 가기 →</a>
</div></div>

<header class="top"><div class="top-in">
  <div class="brand"><a href="./">삼성</a><a class="on" href="lg.html">LG</a></div>
  <h1>LG 가전구독 계산기</h1>

</div></header>

<div class="wrap">
<main>
  <section class="card" id="actCard" style="display:none">
    <h2>🔥 이번 주 활성화 모델 <span class="cnt" id="actCnt"></span></h2>

  <section class="card">
    <h2><span class="num">1</span>모델 찾기 <span class="cnt" id="mCnt"></span></h2>
    <div class="search"><span class="ic">🔍</span><input type="text" id="q" placeholder="모델명 일부 입력 (예: D604, OLED65, WD523)" autocomplete="off" spellcheck="false"></div>
    <div class="chips" id="cats" style="margin-top:10px"></div>

</div>

<div class="foot">Made by 여수본점 김동욱 · 요금은 단가표 기준 참고용이며 실제 요금은 계약 시 확정돼요<br><a href="#" id="admLink">⚙ LG 단가 관리</a></div>

<div class="mbar" id="mbar"><div class="t">견적 <span id="mbN">0</span>개<b id="mbT">월 0원</b></div><button class="btn pri" id="mbGo">견적 보기</button></div>

<div class="modal" id="admModal"><div class="box">
  <h3><span>⚙ LG 단가 관리</span><button id="admClose" aria-label="닫기">✕</button></h3>
  <div id="admBody"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
(function(){var d=new Date(),day=''+d.getFullYear()+(d.getMonth()+1)+d.getDate();
document.write('<script src="data/lg.js?d='+day+'"><\/script><script src="lg-parse.js?d='+day+'"><\/script><script src="config.js?t='+Date.now()+'"><\/script>');})();
</script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function won(n){return Math.round(n).toLocaleString('ko-KR')+'원';}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function lsPut(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},1800);}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function md(s){if(!s)return '';var p=s.split('-');return (+p[1])+'/'+(+p[2]);}

/* ---------- 사번 확인 (삼성 계산기와 같은 사번 사용) ---------- */
var EMP=null;try{EMP=localStorage.getItem('calcEmp')||sessionStorage.getItem('calcEmpS');}catch(e){}
if(!EMP||!/^[0-9]{6}$/.test(EMP)||lsGet('calcBlocked')){$('#gate').classList.add('on');}
$('#meBtn').textContent='👤 '+(EMP||'사번');
$('#meBtn').onclick=function(){location.href='./?to=lg';};
function meGet(){var m=lsGet('calcMe');return m&&m.emp===EMP?m:null;}

/* ---------- 서버 API (삼성 계산기와 같은 Apps Script) ---------- */
function api(fn,arg,ok,fail){if(!window.API_URL){if(fail)fail();return;}
  fetch(window.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,arg:arg===undefined?null:arg})})
  .then(function(r){return r.json();}).then(function(j){if(j&&j.__err){if(fail)fail(j.__err);return;}if(ok)ok(j?j.r:null);})
  .catch(function(e){if(fail)fail(e);});}

/* ---------- 데이터 ---------- */
var REPO=window.LG_DATA,D=null,BY={},GROUPS=[];
(function(){var o=lsGet('ovr_lg');if(window.API_URL&&o&&o.x&&o.x.m)load(o.x);else load(REPO);})();
function load(x){D=x;BY={};D.m.forEach(function(m){BY[m[0]]=m;});
  GROUPS=[];D.m.forEach(function(m){var g=grp(D.cats[m[1]]);if(GROUPS.indexOf(g)<0)GROUPS.push(g);});
  var meta=D.meta||{},t=[];
  if(meta.price)t.push('<span>📄 단가 '+esc(meta.price.replace('전자랜드_',''))+'</span>');
  if(meta.act)t.push('<span>🔥 '+esc(meta.act.replace('구독 활성화 요약',''). replace(/[()]/g,''))+'</span>');
  t.push('<span>모델 '+D.m.length.toLocaleString()+'개</span>');
  $('#dbar').innerHTML=t.join('');}
function grp(c){return String(c).replace(/\s*\(.*$/,'').trim();}
function syncData(){if(!window.API_URL)return;
  api('getDataVer',null,function(v){if(!v)return;var sv=v.lg||'',o=lsGet('ovr_lg'),lv=o?o.ver:'';if(sv===lv)return;
    if(!sv){lsPut('ovr_lg',null);load(REPO);refresh();return;}
    api('getData','lg',function(x){if(!x||!x.m)return;lsPut('ovr_lg',{ver:sv,x:x});load(x);refresh();toast('새 LG 단가표가 적용됐어요');});});}

/* row: [케어형태,케어구분,주기,계약월,결합,소상공인,할인율,기본요금,결합할인,활성화,최종요금,선납,선납최소,선납최대,비고] */
var R={ct:0,cs:1,cy:2,term:3,bd:4,sb:5,rate:6,base:7,bdisc:8,act:9,fin:10,pre:11,pmin:12,pmax:13,note:14};
function careName(r){var a=D.ct[r[R.ct]],b=D.cs[r[R.cs]];return b?a+' · '+b:a;}
function careKey(r){return r[R.ct]+'_'+r[R.cs];}
function bdName(r){var b=D.bd[r[R.bd]];if(b==='소상공인')return '소상공인 '+D.sb[r[R.sb]];return b;}

/* 활성화 요약 기준 추가 할인(주말·기간 추가분이 단가표에 아직 반영 안 된 경우) */
function actInfo(code){var a=D.act&&D.act[code];if(!a)return null;var t=todayStr();
  var live=!a[2]||(t>=a[2]&&t<=a[3]);
  return {mid:a[0],add:a[1],s:a[2],e:a[3],type:a[4],note:a[5],grp:a[6],live:live};}
function topUp(code,r){if(D.bd[r[R.bd]]==='소상공인')return 0;var a=actInfo(code);if(!a||a.type!=='요금인하')return 0;
  var tot=a.mid+(a.live?a.add:0);if(!tot)return 0;var tgt=Math.ceil(tot*1000/72/100)*100;return Math.max(0,tgt-r[R.act]);}
function halfMonths(r){var n=D.notes[r[R.note]]||'',a=actInfo(r._code);var t=n+' '+(a&&a.live?a.note:'');var m=/(\d+)개월\s*(월요금\s*)?반값/.exec(t);return m?+m[1]:0;}

function calc(code,r,pre){r._code=code;var extra=topUp(code,r),mon=r[R.fin]-extra,term=r[R.term];
  var hm=halfMonths(r),half=Math.floor(mon/2/10)*10;
  var preCut=pre>0?Math.floor(pre/term/10)*10:0;
  var monP=Math.max(0,mon-preCut),halfP=Math.max(0,half-preCut);
  var total=pre+(hm?halfP*hm+monP*(term-hm):monP*term);
  return {r:r,extra:extra,mon:mon,monP:monP,hm:hm,halfP:halfP,pre:pre,preCut:preCut,total:total,term:term};}
function minMon(m){var best=null;m[2].forEach(function(r){if(D.bd[r[R.bd]]==='소상공인')return;var v=r[R.fin]-topUp(m[0],r);if(best===null||v<best)best=v;});return best;}

/* ---------- 이번 주 활성화 ---------- */
var ACTCAT='전체';
function renderAct(){var A=D.act||{},L=Object.keys(A).filter(function(c){return BY[c];}).map(function(c){return [c,actInfo(c)];}).filter(function(x){return x[1].type&&(x[1].mid+(x[1].live?x[1].add:0))>0;});
  if(!L.length){$('#actCard').style.display='none';return;}
  $('#actCard').style.display='';$('#actCnt').textContent=L.length+'개';
  var cats=['전체'];L.forEach(function(x){var g=x[1].grp.split(' · ')[0];if(cats.indexOf(g)<0)cats.push(g);});
  if(cats.indexOf(ACTCAT)<0)ACTCAT='전체';
  $('#actCats').innerHTML=cats.map(function(c){return '<button class="chip sm'+(c===ACTCAT?' on':'')+'" data-v="'+esc(c)+'">'+esc(c)+'</button>';}).join('');
  var show=ACTCAT==='전체'&&!renderAct.open?[]:L.filter(function(x){return ACTCAT==='전체'||x[1].grp.split(' · ')[0]===ACTCAT;});

  $('#admBody').innerHTML=h;
  $('#admFile').onchange=function(){var f=this.files[0];if(!f)return;ADM.file=f.name;$('#admPrev').innerHTML='<div class="hint">엑셀을 읽는 중… (파일이 커서 10초쯤 걸려요)</div>';
    loadXLSX(function(){var fr=new FileReader();fr.onload=function(){setTimeout(function(){try{ADM.wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});admSheets();}catch(e){$('#admPrev').innerHTML='<div class="warn">엑셀 파일을 읽지 못했어요</div>';}},30);};fr.readAsArrayBuffer(f);});};
  var rs=$('#admReset');if(rs)rs.onclick=function(){if(!confirm('업로드한 LG 단가를 해제하고 저장소 기본 단가로 되돌릴까요?'))return;api('adminResetData',{pw:ADM.pw,kind:'lg'},function(r){if(r&&r.ok){lsPut('ovr_lg',null);load(REPO);refresh();toast('기본 단가로 되돌렸어요');admMain();}else toast('되돌리지 못했어요');});};}
function admSheets(){var ch=LGParse.sheetChoices(ADM.wb.SheetNames);
  if(!ch.price.length){$('#admPrev').innerHTML='<div class="warn">\'전자랜드_MMDD\' 이름의 단가표 시트를 찾지 못했어요</div>';return;}
  var sel=function(id,list,def,none){return '<select id="'+id+'">'+(none?'<option value="">(활성화 없음)</option>':'')+list.map(function(n){return '<option'+(n===def?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select>';};
  $('#admPrev').innerHTML='<div class="lbl">단가표 시트</div>'+sel('admPs',ch.price,ch.priceDef)+'<div class="lbl">활성화 요약 시트</div>'+sel('admAs',ch.act,ch.actDef,true)+'<button class="btn line wide" id="admParse" style="margin-top:12px">읽어서 미리보기</button><div id="admRes"></div>';
  $('#admParse').onclick=admParse;admParse();}
function admParse(){var ps=$('#admPs').value,as=$('#admAs').value;$('#admRes').innerHTML='<div class="hint">변환 중…</div>';
  setTimeout(function(){try{ADM.data=LGParse.build(XLSX,ADM.wb,ps,as);}catch(e){$('#admRes').innerHTML='<div class="warn">'+esc(e.message||e)+'</div>';return;}
    var d=ADM.data,old=D,add=0,del=0,ch=0,ob={};old.m.forEach(function(m){ob[m[0]]=m;});
    d.m.forEach(function(m){var o=ob[m[0]];if(!o)add++;else if(minMonOf(d,m)!==minMonOf(old,o))ch++;});var nb={};d.m.forEach(function(m){nb[m[0]]=1;});old.m.forEach(function(m){if(!nb[m[0]])del++;});
    var h='<div class="note" style="margin-top:12px">모델 <b>'+d.m.length.toLocaleString()+'</b>개 · 요금 줄 '+d.rows.toLocaleString()+'개 · 활성화 '+Object.keys(d.act).length+'개<br>지금 대비: 새 모델 '+add+' · 빠진 모델 '+del+' · 최저요금 바뀐 모델 '+ch+'</div>';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn line" id="admLocal">이 기기에서만 보기</button><button class="btn pri" id="admSave"'+(ADM.pw?'':' disabled')+'>모든 직원에게 적용</button></div><div class="hint" id="admSaveMsg"></div>';
    $('#admRes').innerHTML=h;
    $('#admLocal').onclick=function(){load(ADM.data);refresh();toast('이 기기에서만 새 단가로 보여요 (새로고침하면 원래대로)');$('#admModal').classList.remove('on');};
    $('#admSave').onclick=function(){var b=this;b.disabled=true;$('#admSaveMsg').textContent='저장 중… (용량이 커서 20초쯤 걸릴 수 있어요)';
      api('adminSaveData',{pw:ADM.pw,kind:'lg',payload:JSON.stringify(ADM.data)},function(r){b.disabled=false;if(r&&r.ok){$('#admSaveMsg').textContent='저장했어요. 직원 화면에는 새로 열 때 적용돼요.';lsPut('ovr_lg',null);load(ADM.data);refresh();syncData();toast('모든 직원에게 적용했어요');}else $('#admSaveMsg').textContent=(r&&r.msg)||'저장하지 못했어요 (Code.gs 업데이트 확인)';},function(){b.disabled=false;$('#admSaveMsg').textContent='서버에 연결하지 못했어요';});};},30);}
function minMonOf(d,m){var s=D;D=d;var v=minMon(m);D=s;return v;}
$('#admLink').onclick=function(e){e.preventDefault();admOpen();};
$('#admClose').onclick=function(){$('#admModal').classList.remove('on');};

function refresh(){renderCats();renderList();renderAct();if(SEL&&!BY[SEL.code])SEL=null;renderPicked();renderCart();}
refresh();syncData();
})();
</script>
</body>
</html>
