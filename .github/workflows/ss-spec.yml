name: 삼성닷컴 스펙 갱신

# 계산기 삼성 모델의 스펙을 삼성닷컴에서 받아 data/spec/ss/ 에 저장 (📋 스펙 비교용)
# 매주 월요일 04:10(한국 시간) · Actions 탭에서 'Run workflow'로 바로 실행도 가능
on:
  schedule:
    - cron: '10 19 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ss-spec
  cancel-in-progress: false

jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 삼성닷컴 스펙 받기
        run: python3 .github/scripts/ss_spec.py
      - name: 바뀐 게 있으면 커밋 · 페이지 다시 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain data/spec)" ]; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spec
          git commit -q -m "삼성닷컴 스펙 갱신"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          curl -s -o /dev/null -w "pages build 요청: %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
