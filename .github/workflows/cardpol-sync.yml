name: LG 카드 정책 이미지 동기화

# 관리자 화면에서 올린 카드 정책 이미지(드라이브 원본)를 저장소 cardpol/ 로 옮겨 담아요.
# 5분마다 확인하고, 바뀐 게 있을 때만 커밋해요. (Actions 탭에서 'Run workflow'로 바로 실행도 가능)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: cardpol-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 드라이브 → cardpol/ 옮겨 담기
        run: python3 .github/scripts/cardpol_sync.py
      - name: 바뀐 게 있으면 커밋 · 페이지 다시 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain cardpol)" ]; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cardpol
          git commit -m "LG 카드 정책 이미지 동기화"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          curl -s -o /dev/null -w "pages build 요청: %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
