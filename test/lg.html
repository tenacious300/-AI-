<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function won(n){return Math.round(n).toLocaleString('ko-KR')+'원';}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function lsPut(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},1800);}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function md(s){if(!s)return '';var p=s.split('-');return (+p[1])+'/'+(+p[2]);}

/* ---------- 사번 확인 (삼성 계산기와 같은 사번 사용) ---------- */
var EMP=null;try{EMP=localStorage.getItem('calcEmp')||sessionStorage.getItem('calcEmpS');}catch(e){}
if(!EMP||!/^[0-9]{6}$/.test(EMP)||lsGet('calcBlocked')){$('#gate').classList.add('on');}
$('#meBtn').textContent='👤 '+(EMP||'사번');
$('#meBtn').onclick=$('#brandTag').onclick=function(){location.href='./?gate=1&brand=lg';};
if(window.TEST_MODE){var tb=document.createElement('div');tb.className='testbar';tb.textContent='🧪 테스트 버전 · 실제 직원 화면에는 아직 반영되지 않았어요';document.body.insertBefore(tb,document.body.firstChild);}
function meGet(){var m=lsGet('calcMe');return m&&m.emp===EMP?m:null;}

/* ---------- 서버 API (삼성 계산기와 같은 Apps Script) ---------- */
function api(fn,arg,ok,fail){if(!window.API_URL){if(fail)fail();return;}
  fetch(window.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,arg:arg===undefined?null:arg})})
  .then(function(r){return r.json();}).then(function(j){if(j&&j.__err){if(fail)fail(j.__err);return;}if(ok)ok(j?j.r:null);})
  .catch(function(e){if(fail)fail(e);});}

/* ---------- 데이터 ---------- */
var REPO=window.LG_DATA,D=null,BY={},GROUPS=[];
(function(){var o=lsGet('ovr_lg');if(window.API_URL&&o&&o.x&&o.x.m)load(o.x);else load(REPO);})();
function load(x){D=x;BY={};D.m.forEach(function(m){BY[m[0]]=m;});
  GROUPS=[];D.m.forEach(function(m){var g=grp(D.cats[m[1]]);if(GROUPS.indexOf(g)<0)GROUPS.push(g);});
  var meta=D.meta||{},t=[];

  t.push('<span>모델 '+D.m.length.toLocaleString()+'개</span>');
  $('#dbar').innerHTML=t.join('');}
function grp(c){return String(c).replace(/\s*\(.*$/,'').trim();}
function syncData(){if(!window.API_URL||window.TEST_MODE)return;
  api('getDataVer',null,function(v){if(!v)return;var sv=v.lg||'',o=lsGet('ovr_lg'),lv=o?o.ver:'';if(sv===lv)return;
    if(!sv){lsPut('ovr_lg',null);load(REPO);refresh();return;}

/* row: [케어형태,케어구분,주기,계약월,결합,소상공인,할인율,기본요금,결합할인,활성화,최종요금,선납,선납최소,선납최대,비고] */
var R={ct:0,cs:1,cy:2,term:3,bd:4,sb:5,rate:6,base:7,bdisc:8,act:9,fin:10,pre:11,pmin:12,pmax:13,note:14};
function careName(r){var a=D.ct[r[R.ct]],b=D.cs[r[R.cs]];return b?a+' · '+b:a;}
function careKey(r){return r[R.ct]+'_'+r[R.cs];}
function bdName(r){var b=D.bd[r[R.bd]];if(b==='소상공인')return '소상공인 '+D.sb[r[R.sb]];return b==='결합없음'?'기본요금':b;}

/* 활성화 요약 기준 추가 할인(주말·기간 추가분이 단가표에 아직 반영 안 된 경우) */
function actInfo(code){var a=D.act&&D.act[code];if(!a)return null;var t=todayStr();
  var live=!a[2]||(t>=a[2]&&t<=a[3]);
  return {mid:a[0],add:a[1],s:a[2],e:a[3],type:a[4],note:a[5],grp:a[6],live:live};}
function topUp(code,r){if(D.bd[r[R.bd]]==='소상공인')return 0;var a=actInfo(code);if(!a||a.type!=='요금인하')return 0;
  var tot=a.mid+(a.live?a.add:0);if(!tot)return 0;var tgt=Math.ceil(tot*1000/72/100)*100;return Math.max(0,tgt-r[R.act]);}
function halfMonths(r){var n=D.notes[r[R.note]]||'',a=actInfo(r._code);var t=n+' '+(a&&a.live?a.note:'');var m=/(\d+)개월\s*(월요금\s*)?반값/.exec(t);return m?+m[1]:0;}

var PRE_RATE=0.001875;
function calc(code,r,pre){r._code=code;var extra=topUp(code,r),mon=r[R.fin]-extra,term=r[R.term];
  var hm=halfMonths(r),half=Math.floor(mon/2/10)*10;
  /* 선납: 월 요금 − 선납금÷개월 − 선납금×0.1875%(연 2.25%) → 100원 미만 버림 (CSMS 단가표 계산식과 동일) */
  var monP=pre>0?Math.max(0,Math.floor((mon-pre/term-pre*PRE_RATE)/100)*100):mon,preCut=mon-monP;
  var preSplit=pre>0?Math.floor(pre/term):0,preBonus=preCut-preSplit,halfP=Math.max(0,half-preCut);
  var total=pre+(hm?halfP*hm+monP*(term-hm):monP*term);
  return {r:r,extra:extra,mon:mon,monP:monP,hm:hm,halfP:halfP,pre:pre,preCut:preCut,preSplit:preSplit,preBonus:preBonus,total:total,term:term};}
function minMon(m){var best=null;m[2].forEach(function(r){if((D.bd[r[R.bd]]==='소상공인')!==(MODE==='sb'))return;var v=r[R.fin]-topUp(m[0],r);if(best===null||v<best)best=v;});return best;}

  if(cats.indexOf(ACTCAT)<0)ACTCAT='전체';
  $('#actCats').innerHTML=cats.map(function(c){return '<button class="chip sm'+(c===ACTCAT?' on':'')+'" data-v="'+esc(c)+'">'+esc(c)+'</button>';}).join('');
  var show=ACTCAT==='전체'&&!renderAct.open?[]:L.filter(function(x){return ACTCAT==='전체'||x[1].grp.split(' · ')[0]===ACTCAT;});

    h+='<div class="a" data-c="'+esc(x[0])+'"><div><b>'+esc(x[0])+'</b>'+(a.note?'<div class="hint" style="margin:2px 0 0;font-size:12px">'+esc(a.note)+'</div>':'')+'</div><div class="v">'+v+'</div></div>';});
  $('#actList').innerHTML=h;var al=$('#actAll');if(al)al.onclick=function(e){e.preventDefault();renderAct.open=true;renderAct();};}
$('#actCats').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;ACTCAT=b.dataset.v;renderAct.open=ACTCAT==='전체'?!renderAct.open:true;renderAct();});

function renderCats(){$('#cats').innerHTML=GROUPS.map(function(g){return '<button class="chip sm'+(g===CAT?' on':'')+'" data-v="'+esc(g)+'">'+esc(g)+'</button>';}).join('');$('#mCnt').textContent=D.m.length.toLocaleString()+'개';}
$('#cats').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;CAT=CAT===b.dataset.v?null:b.dataset.v;renderCats();renderList();});
function badges(code){var a=actInfo(code);if(!a||!a.type)return '';var h='';
  if(a.type==='모상')return a.live?'<span class="bd gift">🎁 상품권</span>':'';
  if(a.mid)h+='<span class="bd act">🔥 활성화</span>';if(a.add&&a.live)h+='<span class="bd wk">+추가 ~'+md(a.e)+'</span>';return h;}
function renderList(){var q=$('#q').value.trim().toUpperCase().replace(/\s+/g,'');var L=$('#list');

/* ---------- 결제 방식 (구독-일반 / 구독-소상공인 / 일시불) ---------- */
var MODE=lsGet('lgMode')||'gen';
function renderMode(){Array.prototype.forEach.call(document.querySelectorAll('#modeSel button'),function(b){b.classList.toggle('on',b.dataset.v===MODE);});}
$('#modeSel').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;MODE=b.dataset.v;lsPut('lgMode',MODE);renderMode();renderList();if(SEL){SEL.bd=null;SEL.sb=null;SEL.pre=0;SEL.preR=0;}renderPicked();});
function isSb(r){return D.bd[r[R.bd]]==='소상공인';}
function modeRows(m){return m[2].filter(function(r){return MODE==='sb'?isSb(r):!isSb(r);});}

/* ---------- 선택한 모델 (결합유형 → 계약기간 → 케어십형태 → 관리유형 → 방문주기 → 선납) ---------- */
var SEL=null;
function pick(code){var m=BY[code];if(!m)return;SEL={code:code,bd:null,sb:null,term:null,ct:null,cs:null,cy:null,pre:0,preR:0};renderPicked();
  setTimeout(function(){var p=$('#picked');if(p)p.scrollIntoView({behavior:'smooth',block:'start'});},30);}
function uniq(arr){var o=[];arr.forEach(function(v){if(o.indexOf(v)<0)o.push(v);});return o;}
function prefer(list,cur,pref){if(cur!=null&&list.indexOf(cur)>=0)return cur;for(var i=0;i<pref.length;i++)if(list.indexOf(pref[i])>=0)return pref[i];return list[0];}
var BD_ORDER=['결합없음','기존결합','신규결합'];
function bdLabel(v){var n=D.bd[v];return n==='결합없음'?'기본요금':n;}
var STEPS=[
  {k:'bd',t:'결합유형',show:function(){return MODE!=='sb';},list:function(rows){return uniq(rows.map(function(r){return r[R.bd];})).sort(function(a,b){return BD_ORDER.indexOf(D.bd[a])-BD_ORDER.indexOf(D.bd[b]);});},pref:function(){return [D.bd.indexOf('결합없음')];},lab:bdLabel},
  {k:'sb',t:'소상공인 대수',show:function(){return MODE==='sb';},list:function(rows){return uniq(rows.map(function(r){return r[R.sb];})).sort(function(a,b){return a-b;});},pref:function(){return [1];},lab:function(v){return esc(D.sb[v]);}},
  {k:'term',t:'계약기간',show:function(){return true;},list:function(rows){return uniq(rows.map(function(r){return r[R.term];})).sort(function(a,b){return b-a;});},pref:function(){return [72];},lab:function(v){return (v/12)+'년';}},
  {k:'ct',t:'케어십 형태',show:function(){return true;},list:function(rows){return uniq(rows.map(function(r){return r[R.ct];}));},pref:function(){return [D.ct.indexOf('방문관리')];},lab:function(v){return esc(D.ct[v]);}},
  {k:'cs',t:'관리유형',show:function(rows){return rows.some(function(r){return D.cs[r[R.cs]];});},list:function(rows){return uniq(rows.map(function(r){return r[R.cs];}));},pref:function(list){return list.filter(function(v){return /^라이트/.test(D.cs[v]);});},lab:function(v){return esc(D.cs[v]||'없음');}},
  {k:'cy',t:'방문주기',show:function(rows){return rows.some(function(r){return D.cy[r[R.cy]];});},list:function(rows){return uniq(rows.map(function(r){return r[R.cy];}));},pref:function(list,rows){var f={};rows.forEach(function(r){f[r[R.cy]]=(f[r[R.cy]]||0)+1;});return list.slice().sort(function(a,b){return f[b]-f[a];});},lab:function(v){return esc(D.cy[v]||'없음');}}
];
var KEYI={bd:R.bd,sb:R.sb,term:R.term,ct:R.ct,cs:R.cs,cy:R.cy};
function resolve(){var m=BY[SEL.code],rows=modeRows(m),out=[];
  if(!rows.length)return {m:m,steps:[],row:null};
  STEPS.forEach(function(st){if(!st.show(rows)){SEL[st.k]=rows[0][KEYI[st.k]];rows=rows.filter(function(r){return r[KEYI[st.k]]===SEL[st.k];});return;}
    var list=st.list(rows);SEL[st.k]=prefer(list,SEL[st.k],st.pref(list,rows));
    out.push({st:st,list:list,rows:rows});rows=rows.filter(function(r){return r[KEYI[st.k]]===SEL[st.k];});});
  return {m:m,steps:out,row:rows[0]};}
function monOf(code,r){return r[R.fin]-topUp(code,r);}
function minOf(code,rows){var v=null;rows.forEach(function(r){var x=monOf(code,r);if(v===null||x<v)v=x;});return v;}
function actOf(code,rows){var v=0;rows.forEach(function(r){var x=(isSb(r)?0:r[R.act])+topUp(code,r);if(x>v)v=x;});return v;}
function stepHtml(code,s,i){var st=s.st,k=st.k,idx=KEYI[k];
  return '<div class="step"><div class="step-h"><span class="sn">'+(i+1)+'</span>'+st.t+'</div><div class="opts" data-k="'+k+'">'+s.list.map(function(v){
    var rs=s.rows.filter(function(r){return r[idx]===v;}),mn=minOf(code,rs),ac=actOf(code,rs),on=String(v)===String(SEL[k]);
    var sub=k==='bd'||k==='sb'?(function(){var r0=rs[0];return r0&&r0[R.rate]?r0[R.rate]+'% 할인':'';})():'';
    return '<button class="opt'+(on?' on':'')+'" data-v="'+esc(v)+'">'+(ac?'<span class="ab">'+(ac/10000>=1?(ac/10000)+'만':ac.toLocaleString())+'원 활성화</span>':'')+'<b>'+st.lab(v)+'</b>'+(sub?'<em>'+sub+'</em>':'')+'<small>월 '+won(mn)+(rs.length>1?'~':'')+'</small></button>';}).join('')+'</div></div>';}
function preRatioAmt(r,p){return Math.floor(r[R.base]*r[R.term]*p/100/100)*100;}
function preAmounts(r,ratio){if(!r[R.pmin])return [];if(ratio!=='f')return [preRatioAmt(r,ratio)];var a=[];for(var v=r[R.pmin];v<=r[R.pmax];v+=100000)a.push(v);if(a[a.length-1]!==r[R.pmax])a.push(r[R.pmax]);return a;}
function renderPicked(){var el=$('#picked');if(!SEL){el.innerHTML='';return;}
  var m=BY[SEL.code],base=m[0].replace(/\..*$/,''),a=actInfo(m[0]);
  var h='<div class="picked"><div class="picked-h"><div><b>'+esc(m[0])+badges(m[0])+'</b><div class="meta">'+esc(D.cats[m[1]])+(m[3]?' · 기준가 '+won(m[3]):'')+'</div></div>'
    +'<a class="btn line sm" href="https://www.lge.co.kr/search/result?search='+encodeURIComponent(base)+'" target="_blank" rel="noopener">LG전자 ↗</a></div>';
  if(MODE==='lump'){
    h+='<div class="brk"><div class="tot"><div><small>일시불 기준가</small><br><b>'+(m[3]?won(m[3]):'정보 없음')+'</b></div></div>';
    h+='<div class="note">일시불은 단가표의 기준가예요. 실제 판매가는 매장 정책에 따라 달라질 수 있어요.</div></div>';
    h+='<button class="btn pri wide" id="addBtn" style="margin-top:14px"'+(m[3]?'':' disabled')+'>＋ 견적에 담기</button></div>';el.innerHTML=h;
    if(m[3])$('#addBtn').onclick=function(){CART.push({code:m[0],lump:1});saveCart();renderCart();toast(m[0]+' 담았어요');};return;}
  var x=resolve(),r=x.row;
  if(!r){el.innerHTML=h+'<div class="note">이 모델은 '+(MODE==='sb'?'소상공인 요금이 없어요':'일반 구독 요금이 없어요')+'</div></div>';return;}
  h+=x.steps.map(function(s,i){return stepHtml(m[0],s,i);}).join('');
  var n=x.steps.length;
  if(r[R.pmin]){var ratios=D.pre[r[R.pre]]?D.pre[r[R.pre]].split(',').map(Number):[];if(!ratios.length)ratios=[30,50];
    if(SEL.preR&&SEL.preR!=='f'&&ratios.indexOf(SEL.preR)<0){SEL.preR=0;SEL.pre=0;}
    var pv=function(P){return won(calc(m[0],r,P).monP);};
    h+='<div class="step"><div class="step-h"><span class="sn">'+(n+1)+'</span>선납 <small>(선택)</small></div><div class="opts" data-k="preR"><button class="opt'+(!SEL.preR?' on':'')+'" data-v="0"><b>선납 안 함</b><small>월 '+won(calc(m[0],r,0).monP)+'</small></button>'+ratios.map(function(p){var P=preRatioAmt(r,p);return '<button class="opt'+(SEL.preR===p?' on':'')+'" data-v="'+p+'"><b>정률 '+p+'%</b><em>'+won(P)+'</em><small>월 '+pv(P)+'</small></button>';}).join('')+'<button class="opt'+(SEL.preR==='f'?' on':'')+'" data-v="f"><b>정액</b><em>'+(r[R.pmin]/10000)+'만~'+(r[R.pmax]/10000)+'만</em><small>10만원 단위</small></button></div>';
    if(SEL.preR){var am=preAmounts(r,SEL.preR);if(am.indexOf(SEL.pre)<0)SEL.pre=am[0];
      if(SEL.preR==='f')h+='<div class="opts sm" data-k="pre">'+am.map(function(v){return '<button class="opt'+(SEL.pre===v?' on':'')+'" data-v="'+v+'"><b>'+(v/10000)+'만원</b><small>월 '+pv(v)+'</small></button>';}).join('')+'</div>';}
    h+='</div>';}else{SEL.pre=0;SEL.preR=0;}
  var c=calc(m[0],r,SEL.pre);
  h+='<div class="brk"><div class="r"><span>정상 구독료</span><span>'+won(r[R.base])+'</span></div>';
  var promo=(isSb(r)?0:r[R.act])+c.extra;
  if(promo)h+='<div class="r minus"><span>프로모션 할인 (활성화'+(c.extra?' · 추가 '+md(a.s)+'~'+md(a.e):'')+')</span><span>−'+won(promo)+'</span></div>';
  if(r[R.bdisc])h+='<div class="r minus"><span>결합 할인 ('+esc(D.bd[r[R.bd]])+' '+r[R.rate]+'%)</span><span>−'+won(r[R.bdisc])+'</span></div>';
  if(isSb(r)&&r[R.act])h+='<div class="r minus"><span>소상공인 할인 ('+esc(D.sb[r[R.sb]])+' '+r[R.rate]+'%)</span><span>−'+won(r[R.act])+'</span></div>';
  if(c.preCut)h+='<div class="r minus"><span>선납 차감 ('+won(c.pre)+' ÷ '+c.term+'개월)</span><span>−'+won(c.preSplit)+'</span></div><div class="r minus"><span>선납 할인 (선납금 × 연 2.25% ÷ 12 · 100원 미만 버림)</span><span>−'+won(c.preBonus)+'</span></div>';
  h+='<div class="tot"><div><small>'+(c.term/12)+'년 · '+esc(careName(r))+(D.cy[r[R.cy]]?' '+esc(D.cy[r[R.cy]]):'')+'</small><br><b>월 '+won(c.monP)+'</b></div><div style="text-align:right"><small>총 금액 ('+(c.term/12)+'년'+(c.pre?', 선납 포함':'')+')</small><br><b style="font-size:17px">'+won(c.total)+'</b></div></div>';
  if(c.hm)h+='<div class="note gift">🎁 처음 '+c.hm+'개월은 반값 <b>월 '+won(c.halfP)+'</b> → 이후 월 '+won(c.monP)+'</div>';
  if(a&&a.type==='모상'&&a.live)h+='<div class="note gift">🎁 '+esc(a.note||'모바일상품권')+' ('+md(a.s)+'~'+md(a.e)+')</div>';
  else if(a&&a.type==='요금인하'&&a.note)h+='<div class="note wk">🔥 '+esc(a.note)+(a.add?' · 추가 활성화 '+md(a.s)+'~'+md(a.e)+(a.live?'':' (종료)'):'')+'</div>';
  var nt=D.notes[r[R.note]];if(nt)h+='<div class="note">📋 '+esc(nt.split('|').join(' / '))+'</div>';
  h+='<div class="hint">제휴카드 할인은 오른쪽 견적에서 카드를 고르면 월 합계에 적용돼요</div>';
  h+='<button class="btn pri wide" id="addBtn" style="margin-top:12px">＋ 견적에 담기</button></div></div>';
  el.innerHTML=h;

    $('#admSave').onclick=function(){var b=this;b.disabled=true;$('#admSaveMsg').textContent='저장 중… (용량이 커서 20초쯤 걸릴 수 있어요)';
      api('adminSaveData',{pw:ADM.pw,kind:'lg',payload:JSON.stringify(ADM.data)},function(r){b.disabled=false;if(r&&r.ok){$('#admSaveMsg').textContent='저장했어요. 직원 화면에는 새로 열 때 적용돼요.';lsPut('ovr_lg',null);load(ADM.data);refresh();syncData();toast('모든 직원에게 적용했어요');}else $('#admSaveMsg').textContent=(r&&r.msg)||'저장하지 못했어요 (Code.gs 업데이트 확인)';},function(){b.disabled=false;$('#admSaveMsg').textContent='서버에 연결하지 못했어요';});};},30);}
